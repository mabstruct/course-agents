[project]
name = "mabgames"
version = "0.1.0"
description = "MABSTRUCT Studio — persistent multi-agent game studio"
requires-python = ">=3.12"
dependencies = [
    # AD1 — domain persistence
    "sqlmodel>=0.0.22",
    # AD2 — pipeline engine, ported from the notebook
    "langchain>=1.3.4",
    "langchain-anthropic>=1.4.4",
    "langchain-openai>=1.2.2",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-sqlite>=3.1.0",
    # AD3 — service in front of the graph
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.46.0",
    # shared
    "pydantic>=2.13.3",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.28.1"]  # httpx: Starlette TestClient

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mabgames"]

[tool.pytest.ini_options]
testpaths = ["tests"]
